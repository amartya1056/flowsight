# Real CCTV: CAVIAR "Shopping Centre in Portugal" corridor view (EC-funded CAVIAR project, Univ. of Edinburgh).
# APPROXIMATE CALIBRATION: hand-estimated from person heights (≈0.014 m/px near, ≈0.026 m/px far) and the
# visible floor edges — no survey measurements were available. Refine with `flowsight calibrate` or the Setup page.
store_id: caviar_corridor
name: Shopping Centre Corridor (CAVIAR, real CCTV)
notes: approximate calibration
floorplan: {image: data/floorplans/caviar_corridor.png, width_m: 4.5, height_m: 9.0}
cameras:
  - id: cam1
    name: Corridor cam (CAVIAR)
    source: data/videos/caviar_corridor.mp4
    approximate: true
    calibration:
      image_points: [[95, 285], [377, 285], [85, 110], [239, 110], [90, 155], [292, 155]]
      floor_points: [[0.3, 8.0], [4.3, 8.0], [0.3, 2.0], [4.3, 2.0], [0.3, 4.6], [4.3, 4.6]]
zones:
  - {id: z_window_far, name: Window Display (far), type: promo, polygon: [[0.3, 1.5], [1.3, 1.5], [1.3, 4.0], [0.3, 4.0]]}
  - {id: z_shop_door, name: Shop Entrance, type: entrance, polygon: [[0.3, 4.0], [1.3, 4.0], [1.3, 6.0], [0.3, 6.0]]}
  - {id: z_window_near, name: Window Display (near), type: promo, polygon: [[0.3, 6.0], [1.3, 6.0], [1.3, 8.5], [0.3, 8.5]]}
  - {id: z_corr_far, name: Corridor (far), type: walkway, polygon: [[1.3, 1.5], [4.3, 1.5], [4.3, 5.0], [1.3, 5.0]]}
  - {id: z_corr_near, name: Corridor (near), type: walkway, polygon: [[1.3, 5.0], [4.3, 5.0], [4.3, 8.5], [1.3, 8.5]]}
fixtures:
  - {name: Shop front, rect: [0.0, 0.0, 0.3, 9.0]}
  - {name: Railing, rect: [4.3, 0.0, 0.2, 9.0]}
doors:
  - {name: Shop door, at: [0.15, 5.0]}
