# Synthetic 20 x 12 m convenience supermarket. Used by the simulator and as the default store.
# Floor coordinates: metres, origin top-left of the floor plan, x right, y down.
store_id: demo_store
name: Demo Supermarket (simulated)
floorplan: { image: data/floorplans/demo_store.png, width_m: 20.0, height_m: 12.0 }
cameras:
  - id: cam1
    name: Ceiling cam (virtual, top-down)
    source: sim
    approximate: false
    calibration:          # identity-like mapping for the virtual top-down camera at 50 px/m
      image_points: [[0, 0], [1000, 0], [1000, 600], [0, 600]]
      floor_points: [[0, 0], [20, 0], [20, 12], [0, 12]]
zones:
  - { id: z_entrance,  name: Entrance,             type: entrance, polygon: [[0.0, 4.5], [2.5, 4.5], [2.5, 7.5], [0.0, 7.5]] }
  - { id: z_walk_west, name: Main Walkway West,    type: walkway,  polygon: [[2.5, 5.0], [8.6, 5.0], [8.6, 7.0], [2.5, 7.0]] }
  - { id: z_walk_mid,  name: Main Walkway @ Aisle 3, type: walkway, polygon: [[8.6, 5.0], [12.0, 5.0], [12.0, 7.0], [8.6, 7.0]] }
  - { id: z_walk_east, name: Main Walkway East,    type: walkway,  polygon: [[12.0, 5.0], [15.5, 5.0], [15.5, 7.0], [12.0, 7.0]] }
  - { id: z_aisle1,    name: Aisle 1 Produce,      type: aisle,    polygon: [[3.0, 0.5], [5.0, 0.5], [5.0, 4.5], [3.0, 4.5]] }
  - { id: z_aisle2,    name: Aisle 2 Bakery,       type: aisle,    polygon: [[6.5, 0.5], [8.5, 0.5], [8.5, 4.0], [6.5, 4.0]] }
  - { id: z_promo1,    name: Promo End-cap,        type: promo,    polygon: [[8.7, 3.9], [10.0, 3.9], [10.0, 4.9], [8.7, 4.9]] }
  - { id: z_aisle3,    name: Aisle 3 Snacks,       type: aisle,    polygon: [[10.2, 0.5], [12.0, 0.5], [12.0, 4.5], [10.2, 4.5]] }
  - { id: z_electro,   name: Electronics,          type: aisle,    polygon: [[13.5, 0.5], [16.0, 0.5], [16.0, 4.5], [13.5, 4.5]] }
  - { id: z_aisle5,    name: Aisle 5 Dairy,        type: aisle,    polygon: [[3.0, 7.5], [5.0, 7.5], [5.0, 11.5], [3.0, 11.5]] }
  - { id: z_aisle6,    name: Aisle 6 Household,    type: aisle,    polygon: [[6.5, 7.5], [8.5, 7.5], [8.5, 11.5], [6.5, 11.5]] }
  - { id: z_pharmacy,  name: Pharmacy Counter,     type: service,  polygon: [[10.0, 8.8], [12.5, 8.8], [12.5, 11.5], [10.0, 11.5]] }
  - { id: z_aisle7,    name: Aisle 7 Pet Care,     type: aisle,    polygon: [[13.6, 9.6], [16.0, 9.6], [16.0, 11.6], [13.6, 11.6]] }
  - { id: z_checkout,  name: Checkout,             type: checkout, polygon: [[15.5, 4.5], [19.5, 4.5], [19.5, 7.5], [15.5, 7.5]] }
# Static fixtures drawn on the floor plan (not analytics zones)
fixtures:
  - { name: Shelf, rect: [2.4, 0.5, 0.5, 4.0] }
  - { name: Shelf, rect: [5.1, 0.5, 1.3, 3.8] }
  - { name: Shelf, rect: [8.6, 0.5, 1.5, 3.3] }
  - { name: Shelf, rect: [12.1, 0.5, 1.3, 4.0] }
  - { name: Shelf, rect: [16.1, 0.5, 0.6, 3.8] }
  - { name: Shelf, rect: [2.4, 7.5, 0.5, 4.0] }
  - { name: Shelf, rect: [5.1, 7.5, 1.3, 4.0] }
  - { name: Shelf, rect: [8.6, 7.5, 1.3, 4.0] }
  - { name: Counter, rect: [10.0, 11.5, 2.5, 0.4] }
  - { name: Shelf, rect: [13.6, 11.6, 2.4, 0.3] }
  - { name: Till, rect: [19.0, 5.5, 0.6, 1.0] }
doors:
  - { name: Entrance, at: [0.0, 6.0] }
  - { name: Exit, at: [19.6, 11.0] }
# ---------------------------------------------------------------------------------------------
# Simulator layout (agent-based shoppers). Waypoint graph in floor metres; `lane: true` nodes get a
# per-agent lateral offset so people don't walk in single file.
sim:
  spawn: [0.3, 6.0]
  exit: [19.7, 11.2]
  arrival_rate_pm: 3.0          # Poisson arrivals per minute (baseline)
  p_checkout: 0.78
  walk_speed: [0.8, 1.4]
  lane_offset_m: 0.65
  nodes:
    E:  {at: [1.4, 6.0], lane: true}
    W1: {at: [4.0, 6.0], lane: true}
    W2: {at: [7.5, 6.0], lane: true}
    W3: {at: [9.35, 6.0], lane: true}
    W4: {at: [11.1, 6.0], lane: true}
    W5: {at: [14.75, 6.0], lane: true}
    A1: {at: [4.0, 2.5]}
    A2: {at: [7.5, 2.3]}
    P1: {at: [9.35, 4.5]}
    A3: {at: [11.1, 2.5]}
    EL: {at: [14.75, 2.5]}
    A5: {at: [4.0, 9.5]}
    A6: {at: [7.5, 9.5]}
    PH: {at: [11.25, 9.7]}
    A7: {at: [14.8, 10.6]}
    X1: {at: [18.4, 9.0]}
    X:  {at: [19.7, 11.2]}
  edges: [[E, W1], [W1, W2], [W2, W3], [W3, W4], [W4, W5], [W1, A1], [W2, A2], [W3, P1], [W4, A3], [W5, EL],
          [W1, A5], [W2, A6], [W4, PH], [W5, A7], [X1, X]]
  destinations:                 # zone -> access node, attractiveness (prob. on shopping list), dwell lognormal
    z_aisle1:   {node: A1, attract: 0.45, dwell_median_s: 35, dwell_sigma: 0.5}
    z_aisle2:   {node: A2, attract: 0.40, dwell_median_s: 30, dwell_sigma: 0.5}
    z_promo1:   {node: P1, attract: 0.35, dwell_median_s: 12, dwell_sigma: 0.4}
    z_aisle3:   {node: A3, attract: 0.60, dwell_median_s: 45, dwell_sigma: 0.5}
    z_electro:  {node: EL, attract: 0.25, dwell_median_s: 60, dwell_sigma: 0.6}
    z_aisle5:   {node: A5, attract: 0.50, dwell_median_s: 30, dwell_sigma: 0.5}
    z_aisle6:   {node: A6, attract: 0.30, dwell_median_s: 25, dwell_sigma: 0.5}
    z_pharmacy: {node: PH, attract: 0.35, dwell_median_s: 50, dwell_sigma: 0.5}
    z_aisle7:   {node: A7, attract: 0.35, dwell_median_s: 30, dwell_sigma: 0.5}
  checkout:
    access_node: W5
    server_at: [18.6, 6.0]
    queue_dir: [-1.0, 0.0]
    slot_spacing_m: 0.75
    service_median_s: 15
    service_sigma: 0.35
    exit_node: X1
  scenarios:
    baseline: {}
    rush_hour: {arrival_profile: [[0, 3.0], [480, 8.0], [1080, 3.0]]}
    blocked_aisle: {arrival_rate_pm: 5.0, obstacles: [{rect: [9.6, 5.0, 1.8, 2.0], max_speed: 0.3, from_s: 300, to_s: 1500}]}
    ignored_promo: {attract: {z_promo1: 0.0}}
    dead_aisle: {attract: {z_aisle7: 0.01}}
